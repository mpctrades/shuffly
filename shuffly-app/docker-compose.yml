services:
  app:
    build: .
    restart: unless-stopped
    # tini as PID 1 forwards SIGTERM to node and reaps zombies.
    init: true
    # Longer than background.server.ts's 50s drain, so a deploy waits for an
    # in-flight reorder instead of killing it at Docker's default 10s.
    stop_grace_period: 60s
    # The json-file driver keeps everything forever by default. Every line is
    # already timestamped by Docker: read them with `docker logs -t`.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    env_file: .env
    networks:
      - internal
    # Bound to localhost only - host nginx (shared with other apps on this
    # server) reverse-proxies to this from 127.0.0.1:3004; the app is never
    # directly reachable on the public IP. 3000/3001/3002/3003 are already
    # taken by other apps on this box.
    ports:
      - "127.0.0.1:3004:3000"
    # SQLite lives at prisma/data/dev.sqlite (relative to schema.prisma), and
    # ONLY that data directory is a named volume.
    #
    # This used to mount the whole prisma/ dir, which shadowed the schema and
    # migrations/ baked into the image: the container kept reading whatever
    # the volume was seeded with on first run, so every deploy after the first
    # silently ignored new migrations while reporting "No pending migrations
    # to apply". Migrations had to be docker cp'd in by hand to recover.
    #
    # Mounting one level deeper keeps the data persistent and lets the schema
    # and migrations come from the image on every deploy, which is the whole
    # point of shipping them in it.
    volumes:
      - shuffly_data:/app/prisma/data

networks:
  internal:

volumes:
  shuffly_data:
